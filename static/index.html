<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scene2Real — Video to robot rehearsal</title>
<meta name="application-name" content="Scene2Real">
<meta name="description" content="Turn warehouse fire footage into a spatial robot rehearsal, from scene analysis to validated motion.">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any">
<meta name="theme-color" content="#0a0d11">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Scene2Real">
<meta property="og:title" content="Scene2Real — Video to robot rehearsal">
<meta property="og:description" content="Turn warehouse fire footage into a spatial robot rehearsal, from scene analysis to validated motion.">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Scene2Real — Video to robot rehearsal">
<meta name="twitter:description" content="Turn warehouse fire footage into a spatial robot rehearsal, from scene analysis to validated motion.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?v=spatial-ui-v4">
<script type="importmap">
{"imports":{
 "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
 "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<a class="skip" href="#main">Skip to stages</a>
<div class="app">
<aside class="side">
  <div class="brand">
    <img class="mark" src="/scene2real-mark.svg" alt="" aria-hidden="true" width="32" height="32">
    <h1>Scene2Real</h1>
  </div>
  <div class="runmeta">
    <span id="run-state" class="pill">idle</span>
    <span id="run-id" class="mono">no run</span>
  </div>
  <nav class="rail" aria-label="Stages">
    <ol id="rail"></ol>
  </nav>
</aside>

<main id="main" tabindex="-1">
  <div id="err" class="error" role="alert" hidden>
    <svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5 18 17H2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 8v4.2M10 14.4v.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <p id="err-msg"></p>
    <button id="err-retry" type="button" class="btn" hidden>Retry</button>
  </div>

  <section id="s1" class="stage" aria-labelledby="h1">
    <header class="sh"><span class="num">1</span><h2 id="h1">Video</h2><span class="status"></span><div class="progress" hidden><i></i></div></header>
    <div class="body split video-split">
      <div class="col-main">
        <label class="field" id="view-field" hidden><span class="label">Active video</span><select id="view-select"></select></label>
        <div id="video-wrap" class="videowrap" hidden>
          <video id="video" controls playsinline preload="metadata"></video>
          <canvas id="overlay" aria-hidden="true"></canvas>
        </div>
        <div id="video-empty" class="placeholder">
          <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="5" y="11" width="28" height="26" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="m33 21 10-6v18l-10-6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          <span>No clip loaded</span>
        </div>
      </div>
      <div class="col-side">
        <div class="field"><span class="label" id="clips-label">Warehouse clips</span><div id="clips" class="stack" role="group" aria-labelledby="clips-label"></div></div>
        <label class="btn file ghost"><svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 13V3m0 0L6 7m4-4 4 4M3 13v3h14v-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Add mp4<input id="file" type="file" accept="video/mp4,.mp4" multiple></label>
        <div id="pending" class="stack" aria-live="polite"></div>
        <button id="btn-load" type="button" class="btn primary">Load selected videos</button>
        <div id="upload-wrap" hidden><label class="mono small" for="upload-prog" id="upload-label">Uploading</label><progress id="upload-prog" max="100" value="0"></progress></div>
        <div id="video-msg" class="msg" role="status"></div>
      </div>
    </div>
  </section>

  <section id="s2" class="stage" aria-labelledby="h2">
    <header class="sh"><span class="num">2</span><h2 id="h2">Cosmos analysis</h2><span class="status"></span><div class="progress" hidden><i></i></div></header>
    <div class="body">
      <div class="row toolbar"><button id="btn-analyse" type="button" class="btn primary">Analyse</button><div id="cosmos-facts" class="facts"></div></div>
      <div id="cosmos-out"></div>
    </div>
  </section>

  <section id="s3" class="stage" aria-labelledby="h3">
    <header class="sh"><span class="num">3</span><h2 id="h3">Confirm target</h2><span class="status"></span><div class="progress" hidden><i></i></div></header>
    <div class="body">
        <div class="field" id="chips-field" hidden>
          <span class="label" id="chips-label">Fire timestamps</span>
          <div id="chips" class="chips" role="group" aria-labelledby="chips-label"></div>
        </div>
      <div id="confirm-out"></div>
    </div>
  </section>

  <section id="s4" class="stage" aria-labelledby="h4">
    <header class="sh"><span class="num">4</span><h2 id="h4">Instruction</h2><span class="status"></span><div class="progress" hidden><i></i></div></header>
    <div class="body"><div id="instr-out"></div></div>
  </section>

  <section id="s5" class="stage" aria-labelledby="h5">
    <header class="sh"><span class="num">5</span><h2 id="h5">Simulation</h2><span class="status"></span><div class="progress" hidden><i></i></div></header>
    <div class="body">
      <div class="row toolbar">
        <button id="btn-scene" type="button" class="btn primary">Generate scene</button>
        <button id="btn-run" type="button" class="btn primary">Run</button>
        <span class="spacer"></span>
        <button id="btn-reset" type="button" class="btn ghost">Reset</button>
        <button id="btn-replay" type="button" class="btn ghost">Replay</button>
        <a id="btn-live" class="btn" href="/live.html" target="_blank" rel="noopener" hidden>Live G1 rehearsal ↗</a>
      </div>
      <div class="simwrap">
        <div id="sim" class="sim"><div id="sim-empty" class="simempty">No trajectory</div></div>
        <div class="scrub">
          <button id="btn-play" type="button" class="btn small" disabled>Play</button>
          <input id="scrub" type="range" min="0" max="0" value="0" step="1" aria-label="Frame" disabled>
          <span id="sim-time" class="mono small">0.00 / 0.00 s</span>
          <label class="row small">Speed <select id="sim-speed" aria-label="Simulation speed"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select></label>
        </div>
      </div>
    </div>
  </section>

  <section id="s6" class="stage" aria-labelledby="h6">
    <header class="sh"><span class="num">6</span><h2 id="h6">Metrics</h2><span class="status"></span><div class="progress" hidden><i></i></div></header>
    <div class="body"><div id="metrics-out"></div></div>
  </section>
</main>
</div>
  <script type="module" src="/app.js?v=spatial-ui-v4"></script>
</body>
</html>
